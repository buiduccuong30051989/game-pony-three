<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nhím pony" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="theme-color" content="#fff4e4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦄%3C/text%3E%3C/svg%3E" />
  <title>Nhím và phép thuật tình bạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff4e4; --ink: #3b3220; --accent: #ff9600; --success: #58cc02; --error: #da5e4e;
      --blue: #1cb0f6; --magic: #a06cd5; --pink: #ff7ac8; --card: #fffaf0; --shadow: 0 6px 0 rgba(59, 50, 32, .18);
      --safe-l: max(14px, env(safe-area-inset-left)); --safe-r: max(14px, env(safe-area-inset-right));
      --safe-t: max(12px, env(safe-area-inset-top)); --safe-b: max(14px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); position: fixed; inset: 0; overscroll-behavior: none; }
    /* iPad: không zoom chụm / chạm đúp, không bôi đen chữ, không menu giữ lâu, không kéo nảy trang */
    body {
      font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; color: var(--ink);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    button, img { -webkit-touch-callout: none; -webkit-user-drag: none; touch-action: manipulation; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .big {
      appearance: none; border: 5px solid var(--ink); border-radius: 999px; background: #fff;
      width: 92px; height: 92px; font: inherit; font-size: 46px; line-height: 1; cursor: pointer;
      box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); touch-action: none;
      transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    }
    .big:active, .big.down { transform: translateY(4px); box-shadow: 0 2px 0 rgba(59, 50, 32, .18); background: #ffe9c2; }

    /* điều khiển: đi bằng chạm đất (không D-pad); nút nhảy tím + 🪽 bay to ở góc phải dưới (port từ game 5) */
    #ctrl-jump { position: fixed; z-index: 5; right: calc(var(--safe-r) + 6px); bottom: calc(var(--safe-b) + 6px); width: 150px; height: 150px; font-size: 72px; background: radial-gradient(circle at 40% 35%, #d8b4ff, var(--magic)); border-color: #6f3fa8; color: #fff; }
    #fly-btn { position: fixed; z-index: 5; right: calc(var(--safe-r) + 172px); bottom: calc(var(--safe-b) + 6px); width: 150px; height: 150px; font-size: 76px;
      background: radial-gradient(circle at 40% 35%, #fff, #ffe3f3); border-color: #ff7ac8; }
    #fly-btn.on { background: radial-gradient(circle at 40% 35%, #fff, #ffd1f0); border-color: #ff5fa8; animation: pulse .5s ease-in-out infinite; }
    #fly-btn.cool { opacity: .45; }

    /* HUD */
    #hud { position: fixed; top: var(--safe-t); left: calc(var(--safe-l) + 4px); right: calc(var(--safe-r) + 4px); display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
    .pill { background: var(--card); border: 4px solid var(--ink); border-radius: 999px; padding: 4px 18px; font-size: 30px; font-weight: 800; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }
    #stars span { opacity: .25; transition: transform .3s, opacity .3s; display: inline-block; }
    #stars span.on { opacity: 1; animation: pop .5s ease; }
    @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35) rotate(12deg); } 100% { transform: scale(1); } }

    /* bảng thử thách */
    #panel {
      position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 8; width: min(760px, 94vw);
      background: rgba(255, 250, 240, .96); border: 5px solid var(--ink); border-radius: 30px; padding: 16px 20px 20px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    #panel-top { display: flex; align-items: center; gap: 14px; min-height: 60px; }
    #repeat { width: 90px; height: 90px; font-size: 42px; }
    #word { font-size: clamp(48px, 7vw, 84px); font-weight: 800; letter-spacing: .04em; display: flex; gap: .02em; }
    #word span { transition: color .15s, transform .15s; display: inline-block; }
    #word span.lit { color: var(--accent); transform: translateY(-6px) scale(1.08); }
    #word.whole span { color: var(--success); animation: bounce .5s ease; }
    @keyframes bounce { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-3deg); } 100% { transform: scale(1); } }
    #counter { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); border: 5px solid var(--ink); color: #fff; font-size: 44px; font-weight: 800; display: grid; place-items: center; }
    #counter.bump { animation: bump .35s ease; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
    #gemrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 700px; }
    .gem { appearance: none; border: 0; background: none; font-size: 60px; line-height: 1; cursor: pointer; padding: 14px; min-width: 90px; min-height: 90px; transition: transform .2s, opacity .2s; filter: drop-shadow(0 4px 0 rgba(59,50,32,.2)); }
    .gem.done { transform: scale(.75); opacity: .35; }
    #options { display: flex; gap: 18px; }
    .opt {
      appearance: none; border: 6px solid var(--ink); border-radius: 26px; background: #fff; color: var(--ink);
      width: 132px; height: 132px; font: inherit; font-size: 76px; font-weight: 800; box-shadow: var(--shadow); cursor: pointer;
      display: grid; place-items: center; transition: transform .15s, opacity .25s;
    }
    .opt:active { transform: translateY(4px); }
    .opt.correct { background: var(--success); color: #fff; border-color: #3f9500; }
    .opt.gone { opacity: 0; transform: scale(.4); pointer-events: none; }
    .opt.hint { animation: hint .7s ease-in-out infinite; border-color: var(--accent); }
    @keyframes hint { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,150,0,.35); } }
    .wobble { animation: wobble .45s ease; }
    @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-4deg); } }
    #cast { width: 150px; height: 150px; font-size: 76px; background: var(--magic); border-color: #6f3fa8; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    #toast {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none;
      font-size: clamp(48px, 8vw, 96px); font-weight: 800; color: #fff; -webkit-text-stroke: 3px var(--ink);
      text-shadow: 0 6px 0 rgba(59,50,32,.25); opacity: 0; transition: opacity .25s, transform .25s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    /* bản đồ + start */
    .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(255, 244, 228, .94); transition: opacity .45s ease; }
    .overlay.hide { opacity: 0; pointer-events: none; }
    #start-btn { width: 180px; height: 180px; font-size: 96px; background: var(--magic); border-color: #6f3fa8; opacity: .5; }
    #start-btn.ready { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
    .overlay p { position: absolute; bottom: 12%; font-size: 24px; opacity: .65; }
    #map h1 { position: absolute; top: 6%; font-size: 40px; margin: 0; }


    /* nút nhà + màn đêm (viền tím mờ theo --night do world.setNight ghi) */
    #home { position: fixed; z-index: 6; top: calc(var(--safe-t) + 72px); left: calc(var(--safe-l) + 4px); width: 92px; height: 92px; font-size: 44px; }
    #night { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: calc(var(--night, 0) * .75);
      background: radial-gradient(ellipse at 50% 45%, rgba(40,30,110,0) 55%, rgba(40,30,110,.55) 100%); transition: opacity .3s; }
    .hgem { font-size: 34px; text-shadow: 0 0 0 transparent; opacity: .25 !important; -webkit-text-stroke: 2px rgba(59,50,32,.5); }
    .hgem.on { opacity: 1 !important; filter: drop-shadow(0 0 8px currentColor); transform: scale(1.25); }
    #panel.low { top: auto; bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 16px; gap: 10px 14px; flex-direction: row; flex-wrap: wrap; justify-content: center; width: auto; max-width: 94vw; }
    #panel.low #panel-top { min-height: 0; }
    #panel.low .opt { width: 118px; height: 118px; font-size: 66px; }

    /* chớp sáng cầu vồng */
    #flash { position: fixed; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(circle, #fff 30%, #ffe9a8 60%, #ffd1f0 100%); opacity: 0; }
    #flash.go { animation: flashGo ease-out forwards; }
    @keyframes flashGo { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

    /* thẻ người nhà cổ vũ (src/family.ts): trượt vào từ mép phải */
    #family { position: fixed; right: max(14px, env(safe-area-inset-right)); top: calc(max(14px, env(safe-area-inset-top)) + 80px); z-index: 12; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
    .fam-card { --fam: #ff5fb4; display: flex; align-items: center; gap: 14px; background: #fffaf0; border: 5px solid var(--fam); border-radius: 999px 40px 40px 999px; padding: 8px 26px 8px 8px;
      box-shadow: var(--shadow), 0 0 0 6px rgba(255,255,255,.55); max-width: min(560px, 82vw); animation: famIn .5s cubic-bezier(.2,1.5,.4,1) both; position: relative; }
    .fam-card::after { content: '💖'; position: absolute; left: -8px; top: -12px; font-size: 32px; animation: famHeart 1.2s ease-in-out infinite; }
    .fam-card.dark { background: #ece6ff; }
    .fam-card.dark::after { content: '🌙'; }
    .fam-card.out { animation: famOut .45s ease-in both; }
    .fam-ava { width: 104px; height: 104px; flex: none; border-radius: 50%; border: 5px solid var(--fam); background: radial-gradient(circle at 50% 35%, #fff, #f1e6ff); display: grid; place-items: center; font-size: 66px; line-height: 1; position: relative; animation: famBob .9s ease-in-out infinite alternate; }
    .fam-ava > img:first-child, .node-ava > img:first-child, .end-ava > img:first-child, .map-hero-ava > img:first-child { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
    .fam-photo { position: absolute; right: -8px; bottom: -6px; width: 44%; height: 44%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(59,50,32,.25); }
    .fam-body { display: flex; flex-direction: column; min-width: 0; }
    .fam-name { font-size: 32px; font-weight: 800; color: var(--fam); line-height: 1.05; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .fam-name small { font-size: 18px; color: var(--ink); opacity: .6; }
    .fam-say { font-size: 28px; font-weight: 800; line-height: 1.15; color: var(--ink); }
    .fam-card.mini { padding: 5px 18px 5px 5px; gap: 10px; }
    .fam-card.mini::after { display: none; }
    .fam-card.mini .fam-ava { width: 68px; height: 68px; font-size: 42px; border-width: 4px; }
    .fam-card.mini .fam-name { font-size: 22px; }
    .fam-card.mini .fam-name small { font-size: 15px; }
    .fam-card.mini .fam-say { font-size: 21px; }
    @keyframes famIn { from { transform: translateX(120%) rotate(6deg); opacity: 0; } to { transform: translateX(0) rotate(0); opacity: 1; } }
    @keyframes famOut { to { transform: translateX(120%); opacity: 0; } }
    @keyframes famBob { from { transform: translateY(-3px) rotate(-4deg); } to { transform: translateY(3px) rotate(4deg); } }
    @keyframes famHeart { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.15); } }

    /* bản đồ: 7 nút trên đường uốn lượn */
    #map { background: linear-gradient(180deg, #3a3a8c 0%, #8f7fd0 55%, #ffe9c9 100%); }
    #map h1 { display: flex; align-items: center; gap: 14px; color: #fff; -webkit-text-stroke: 1px rgba(59,50,32,.35); text-shadow: 0 4px 0 rgba(40,30,90,.35); }
    .map-hero-ava { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: #f1e6ff; display: grid; place-items: center; font-size: 44px; animation: famBob 1s ease-in-out infinite alternate; }
    #map-nodes { display: flex; flex-wrap: wrap; gap: 26px 20px; justify-content: center; max-width: 980px; padding: 0 12px; margin-top: 40px; }
    .node { --c: #a06cd5; appearance: none; border: 0; background: none; padding: 0; font: inherit; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center;
      transform: translateY(calc(sin(var(--i) * 1.3) * 26px)); }
    .node-ava { width: 112px; height: 112px; border-radius: 50%; border: 6px solid var(--c); background: radial-gradient(circle at 50% 35%, #fff, #f1e6ff); display: grid; place-items: center; font-size: 66px; line-height: 1; box-shadow: var(--shadow); position: relative; transition: transform .15s; }
    .node:not(.locked):active .node-ava { transform: scale(.94); }
    .node:not(.locked):not(.done) .node-ava { animation: pulse 1.3s ease-in-out infinite; }
    .node small { margin-top: 6px; font-size: 21px; font-weight: 800; color: #fff; background: var(--c); border-radius: 999px; padding: 0 12px; box-shadow: 0 3px 0 rgba(59,50,32,.25); white-space: nowrap; }
    .node i { font-style: normal; font-size: 16px; font-weight: 800; color: #fff; opacity: .9; text-shadow: 0 2px 0 rgba(40,30,90,.4); margin-top: 2px; white-space: nowrap; }
    .node b { position: absolute; top: -6px; left: 2px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid var(--c); font-size: 20px; display: grid; place-items: center; color: var(--ink); }
    .node.locked { opacity: .45; filter: grayscale(.8); cursor: default; }
    .node.done::after { content: '⭐'; position: absolute; right: -8px; top: -12px; font-size: 38px; }
    .node.final .node-ava { width: 136px; height: 136px; background: radial-gradient(circle at 50% 35%, #cfc4ff, #4b3b9a); }

    /* màn kết */
    #ending { background: linear-gradient(180deg, rgba(191,227,251,.86) 0%, rgba(255,244,228,.9) 70%); z-index: 25; }
    .end-box { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 0 16px; }
    .end-sun { font-size: 96px; animation: spinSlow 8s linear infinite; }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    #ending h2 { margin: 0; font-size: clamp(44px, 7vw, 78px); color: #ff7ac8; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 6px 0 rgba(59,50,32,.2); }
    #ending-fam { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 900px; }
    .end-ava { width: 96px; height: 96px; border-radius: 50%; border: 5px solid; background: #fff; display: grid; place-items: center; font-size: 58px; position: relative; animation: endHop .8s ease-in-out infinite alternate both; }
    .end-ava:first-child { width: 132px; height: 132px; font-size: 80px; }
    @keyframes endHop { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    #ending-home { width: 110px; height: 110px; font-size: 54px; }


    /* nhà bạn bè dưới bản đồ + bộ sưu tập bạn pony */
    #map-friends { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; max-width: 94vw; padding: 8px 18px 8px 20px; border: 4px solid #fff; border-radius: 999px;
      background: linear-gradient(180deg, #ffb3dc, #ff7ac8); color: #fff; font: inherit; font-weight: 800; font-size: 22px; cursor: pointer;
      box-shadow: 0 6px 0 rgba(59,50,32,.25); -webkit-text-stroke: .5px rgba(59,50,32,.3); }
    #map-friends:active { transform: translateX(-50%) scale(.96); }
    .mf-label { white-space: nowrap; }
    .mf-faces { display: flex; align-items: center; }
    .mf-ava { width: 52px; height: 52px; margin-left: -10px; border-radius: 50%; border: 3px solid #fff; background: #fff; overflow: hidden; flex: none; animation: famBob .9s ease-in-out infinite alternate; }
    .mf-ava > img:first-child, .gal-ava > img:first-child, .end-fr > img:first-child { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
    .mf-more { margin-left: 6px; font-size: 22px; }
    #gallery { background: linear-gradient(180deg, rgba(58,58,140,.96), rgba(143,127,208,.96) 60%, rgba(255,233,201,.96)); z-index: 15; }
    .gal-box { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; max-height: 100vh; overflow-y: auto; }
    .gal-box h2 { margin: 0; color: #fff; font-size: clamp(28px, 4.5vw, 44px); text-shadow: 0 4px 0 rgba(40,30,90,.35); }
    #gallery-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px 12px; max-width: 900px; width: 100%; }
    .gal-card { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: endHop .9s ease-in-out infinite alternate both; }
    .gal-ava { width: 104px; height: 104px; max-width: 100%; aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--c); background: radial-gradient(circle at 50% 35%, #fff, #f1e6ff);
      display: grid; place-items: center; font-size: 54px; font-weight: 800; color: #b9a8e8; overflow: hidden; }
    .gal-card small { font-size: 16px; font-weight: 800; color: #fff; background: var(--c); border-radius: 999px; padding: 0 10px; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .gal-card.locked { animation: none; opacity: .55; }
    .gal-card.locked .gal-ava { border-color: #cfc4ff; background: #e8e2ff; }
    .gal-card.locked small { background: #9d93c9; }
    #ending-friends { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
    .end-fr { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: #fff; overflow: hidden; animation: endHop .7s ease-in-out infinite alternate both; }
    @media (max-width: 720px) {
      #gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #map-friends { font-size: 18px; }
      .mf-ava { width: 40px; height: 40px; }
    }

    /* màn dọc: nhắc xoay ngang */
    #rotate { display: none; z-index: 50; background: linear-gradient(180deg, #c9b6ff, #ffd9ec); flex-direction: column; gap: 20px; font-size: 32px; font-weight: 800; color: #6f3fa8; text-align: center; padding: 30px; }
    #rotate div { font-size: 120px; animation: spinHint 2s ease-in-out infinite; }
    @keyframes spinHint { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 1100px) { #rotate { display: flex; } }
    #perf { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 60; background: rgba(0,0,0,.6); color: #fff; font: 14px monospace; padding: 2px 10px; border-radius: 8px; pointer-events: none; }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
    #confetti i { position: absolute; top: -20px; width: 14px; height: 22px; border-radius: 4px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }

    @media (max-width: 720px) {
      .big { width: 80px; height: 80px; font-size: 40px; }
      #ctrl-jump, #fly-btn { width: 112px; height: 112px; font-size: 54px; }
      #fly-btn { right: calc(var(--safe-r) + 130px); }
      .opt { width: 104px; height: 104px; font-size: 60px; }
      .pill { font-size: 24px; }
      #home { width: 80px; height: 80px; font-size: 38px; }
      .fam-ava { width: 78px; height: 78px; font-size: 50px; }
      .fam-name { font-size: 24px; } .fam-say { font-size: 21px; }
      .node-ava { width: 88px; height: 88px; font-size: 52px; }
      .node.final .node-ava { width: 104px; height: 104px; }
      #panel.low .opt { width: 96px; height: 96px; font-size: 54px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" hidden>
    <div class="pill" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="pill" id="gems-pill"><span>💎</span><span id="gems">0</span></div>
  </div>
  <button id="home" class="big" aria-label="Về bản đồ" hidden>🏠</button>
  <div id="night" aria-hidden="true"></div>

  <button id="ctrl-jump" class="big" aria-label="Nhảy" hidden>⬆</button>
  <button id="fly-btn" class="big" aria-label="Bay" hidden>🪽</button>

  <div id="panel" hidden>
    <div id="panel-top">
      <button id="repeat" class="big" aria-label="Nghe lại">🔊</button>
      <div id="word" hidden></div>
      <div id="counter" hidden></div>
    </div>
    <div id="gemrow" hidden></div>
    <div id="options"></div>
    <button id="cast" class="big" aria-label="Làm phép" hidden>✨</button>
  </div>

  <div id="toast"></div>
  <div id="confetti"></div>

  <div id="flash" hidden></div>

  <div id="map" class="overlay" hidden>
    <h1><span id="map-hero"></span>Nhím đi cứu cả nhà</h1>
    <div id="map-nodes"></div>
    <button id="map-friends" aria-label="Các bạn pony đã cứu"></button>
  </div>

  <div id="gallery" class="overlay" hidden>
    <div class="gal-box">
      <h2>Các bạn pony Nhím đã cứu</h2>
      <div id="gallery-grid"></div>
      <button id="gallery-close" class="big" aria-label="Đóng">✖</button>
    </div>
  </div>

  <div id="ending" class="overlay" hidden>
    <div class="end-box">
      <div class="end-sun">☀️</div>
      <h2>Nhím đã cứu cả nhà!</h2>
      <div id="ending-fam"></div>
      <div id="ending-friends"></div>
      <button id="ending-home" class="big" aria-label="Về bản đồ">🏠</button>
    </div>
  </div>

  <div id="start" class="overlay">
    <button id="start-btn" class="big" aria-label="Bắt đầu">🦄</button>
    <p>Nhím ơi, chạm để bắt đầu</p>
  </div>

  <div id="rotate" class="overlay"><div>📱</div>Nhím ơi, xoay ngang máy nhé!</div>
  <div id="perf" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
